name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .

  deploy:
    needs: check
    runs-on: ubuntu-latest
    # Opt-in. Leave the SITE_URL repository variable unset if you deploy with
    # Cloudflare Workers Builds (the dashboard Git integration) instead — then
    # this workflow is purely a quality gate and Cloudflare owns deployment,
    # so the two never race to deploy the same commit.
    #
    # Set SITE_URL only if you want GitHub Actions to be the deployer. The
    # `secrets` context is not available in a job-level `if`, so the variable is
    # the gate — and it's required for deploys anyway, since the sitemap and OG
    # image need an absolute origin.
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fail loudly and early rather than deep inside a wrangler stack trace.
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::SITE_URL is set but these repository secrets are missing:$missing"
            exit 1
          fi

      # Must be `npm run deploy`, which chains the OpenNext build before the
      # deploy. Calling `opennextjs-cloudflare deploy` on its own fails with
      # "Could not find compiled Open Next config".
      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Absolute origin for canonical URLs, sitemap and the OG image.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          # Lifts the GitHub API rate limit for the build's data fetch. Shared CI
          # runners burn through the 60 req/hr unauthenticated limit; without it
          # the build silently falls back to lib/github-snapshot.json.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
